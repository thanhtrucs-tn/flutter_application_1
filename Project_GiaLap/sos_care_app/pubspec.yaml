name: sos_care_app
description: "Flutter caregiver app for SOS Care with realtime Socket.IO alerts."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.8.0

  # Socket.IO client
  socket_io_client: ^2.0.3

  # Local push notifications for foreground alerts
  flutter_local_notifications: ^18.0.1

  # Date formatting and utilities
  intl: ^0.20.2

  # Functional result type
  dartz: ^0.10.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
