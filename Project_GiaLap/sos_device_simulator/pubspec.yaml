name: sos_device_simulator
description: "Flutter app simulating an SOS wearable device for elderly care system testing."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.8.0

  # Socket.IO client for backend delivery acknowledgements
  socket_io_client: ^2.0.3

  # Location
  geolocator: ^13.0.4

  # Functional result type
  dartz: ^0.10.1

  # Date formatting and utilities
  intl: ^0.20.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
